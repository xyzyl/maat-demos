[workspace]
members = [
    "testkit",
    "commerce/store",
    "commerce/agent",
    "email-outreach/mailer",
    "email-outreach/agent",
    "deploy/runner",
    "deploy/agent",
]
resolver = "2"

[workspace.dependencies]
# Maat protocol library + SDK — path deps to siblings of maat-demos/.
maat            = { path = "../maat" }
maat-sdk-core   = { path = "../maat-sdk-slice9/crates/maat-sdk-core" }
maat-agent      = { path = "../maat-sdk-slice9/crates/maat-agent" }
maat-resource   = { path = "../maat-sdk-slice9/crates/maat-resource" }

# Async + HTTP.
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["macros", "tokio"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tower-http   = { version = "0.5", features = ["trace"] }
async-trait  = "0.1"

# Serialization.
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
base64       = "0.22"

# Errors + logging.
thiserror    = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Identity + storage.
uuid         = { version = "1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
sqlx         = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls", "postgres", "sqlite", "chrono", "uuid", "macros",
]}

# Misc.
rand         = "0.8"
parking_lot  = "0.12"
sha2         = "0.10"
hex          = "0.4"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
tempfile     = "3"
