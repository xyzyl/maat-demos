[package]
name = "commerce-store"
version = "0.1.0"
edition = "2021"

[lib]
name = "commerce_store"
path = "src/lib.rs"

[[bin]]
name = "commerce-stored"
path = "src/main.rs"

[dependencies]
maat            = { workspace = true }
maat-sdk-core   = { workspace = true }
maat-resource   = { workspace = true }

tokio        = { workspace = true }
axum         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
base64       = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror    = { workspace = true }
anyhow       = { workspace = true }
async-trait  = { workspace = true }
sqlx         = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true }

# Stripe.
async-stripe = { version = "0.40", features = ["runtime-tokio-hyper-rustls", "checkout", "billing"] }

[dev-dependencies]
tempfile = { workspace = true }
